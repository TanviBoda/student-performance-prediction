<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h1>Student Performance Prediction</h1>

    <p>Enter student details:</p>

    <form action="/predict" method="post">

        <label>Study Hours:</label>
        <input type="number" name="study_hours" step="0.1" required>
        <br><br>

        <label>Attendance (%):</label>
        <input type="number" name="attendance" step="0.1" required>
        <br><br>

        <label>Previous Marks (%):</label>
        <input type="number" name="previous_marks" step="0.1" required>
        <br><br>

        <label>Assignment Score (%):</label>
        <input type="number" name="assignment_score" step="0.1" required>
        <br><br>

        <label>Internal Marks (%):</label>
        <input type="number" name="internal_marks" step="0.1" required>
        <br><br>

        <button type="submit">Predict Performance</button>

    </form>

    {% if result %}
        <h2>Result: {{ result }}</h2>
    {% endif %}

</body>
</html>
